services:
  tle:
    build: .
    image: tle-bot:latest

    env_file: .env

    ports:
      - "${OAUTH_SERVER_PORT:-8080}:${OAUTH_SERVER_PORT:-8080}"

    volumes:
      - ./data:/bot/data

    # `;meta restart` exits 42 and `;meta kill` exits 0, so this policy is
    # what makes the difference between the two: a non-zero exit is brought
    # back up, a clean one is left down. Crashes are restarted too, which the
    # old run.sh loop did not do.
    restart: on-failure

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      - TZ=UTC
